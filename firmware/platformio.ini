; OODA Pomodoro puck — ESP32-S3 firmware (Adafruit STEMMA QT build)
;
; Primary link:  USB-C  (native USB-CDC serial to the OODA host, + power)
; Fallback link: WiFi   (HTTP + SSE, used only when the USB link is quiet)
;
; Build:   pio run
; Flash:   pio run -t upload
; Debug:   pio device monitor        (see DEBUG_LOG in src/config.h — the USB
;                                      port carries the host protocol, so logs
;                                      go to the UART on the TX/RX pads instead)
;
; First build: copy the config template and fill it in:
;   cp src/config.h.example src/config.h
; (config.h is git-ignored so your WiFi password / token never get committed.)

[env:adafruit_qtpy_esp32s3]
platform = espressif32@6.5.0
; Adafruit QT Py ESP32-S3, 8MB flash / no PSRAM (product #5426).
; For the 2MB-PSRAM variant use: adafruit_qtpy_esp32s3_n4r2
board = adafruit_qtpy_esp32s3_nopsram
framework = arduino
monitor_speed = 115200

build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1   ; Serial == native USB-CDC (the host link)
	-DCORE_DEBUG_LEVEL=0

lib_deps =
	adafruit/Adafruit SSD1306 @ ^2.5.9
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit seesaw Library @ ^1.7.5
	bblanchon/ArduinoJson @ ^7.0.4
