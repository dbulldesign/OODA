; OODA Pomodoro puck — ESP32 firmware (Adafruit Feather V2, solderless build)
;
; Board: Adafruit ESP32 Feather V2 *with Headers* (#5900) seated in an assembled
; Terminal Block Breakout FeatherWing (#2926) — screw terminals for every pin, so
; the whole device goes together with zero soldering. The OLED and encoder plug in
; over STEMMA QT; the buzzer's two legs clamp into screw terminals.
;
; Primary link:  USB-C  (via the board's CP2102 USB-serial bridge, + power)
; Fallback link: WiFi   (HTTP + SSE, used only when the USB link is quiet)
;
; Build:   pio run
; Flash:   pio run -t upload
;
; First build: copy the config template and fill it in:
;   cp src/config.h.example src/config.h
; (config.h is git-ignored so your WiFi password / token never get committed.)

[env:adafruit_feather_esp32_v2]
platform = espressif32@6.5.0
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200

build_flags =
	-DCORE_DEBUG_LEVEL=0

lib_deps =
	adafruit/Adafruit SSD1306 @ ^2.5.9
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit seesaw Library @ ^1.7.5
	bblanchon/ArduinoJson @ ^7.0.4
