; OODA Pomodoro puck — ESP32 firmware
;
; Build with PlatformIO:  `pio run`  /  flash with  `pio run -t upload`.
; Serial monitor:         `pio device monitor` (115200 baud).
;
; Before the first build, copy the config template and fill it in:
;   cp src/config.h.example src/config.h
; (config.h is git-ignored so your WiFi password / token never get committed.)

[env:esp32dev]
platform = espressif32@6.5.0      ; Arduino core 2.0.x — ships tone()/noTone()
board = esp32dev                  ; any WROOM-32 devkit; change to your board
framework = arduino
monitor_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=0

lib_deps =
	adafruit/Adafruit SSD1306 @ ^2.5.9
	adafruit/Adafruit GFX Library @ ^1.11.9
	bblanchon/ArduinoJson @ ^7.0.4
	madhephaestus/ESP32Encoder @ ^0.11.7
